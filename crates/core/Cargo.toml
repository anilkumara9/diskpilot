[package]
name = "diskpilot-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Storage intelligence engine: scanning, classification, recommendations, safety-gated cleanup"

[lib]
name = "diskpilot_core"
path = "src/lib.rs"

[[bin]]
name = "diskpilot-scan"
path = "src/bin/diskpilot-scan.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
trash = "5"
sha2 = "0.10"
dirs = "6"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
keyring = { version = "3", optional = true }

[features]
default = []
assistant-http = ["dep:reqwest"]
keyring-storage = ["dep:keyring"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
