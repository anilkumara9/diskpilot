[package]
name = "diskpilot-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Storage intelligence engine: scanning, classification, recommendations, safety-gated cleanup"

[lib]
name = "diskpilot_core"
path = "src/lib.rs"

[[bin]]
name = "diskpilot-scan"
path = "src/bin/diskpilot-scan.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
trash = "5"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
dirs = "6"
fs2 = "0.4"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }
# WinRT surface for the OCR module only (Windows.Media.Ocr over
# image bytes in a memory stream), plus the small Win32 file-IO
# surface the MFT volume reader names (CreateFileW / ReadFile /
# SetFilePointerEx on the raw volume) and the USN journal ioctls
# the live index names (DeviceIoControl over the same volume
# handle). Kept to the features those modules name so the crate's
# footprint stays confined to `ocr.rs`, `mft_volume.rs` and
# `usn_volume.rs`.
windows = { version = "0.59", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
keyring = { version = "3", optional = true }

[features]
default = []
assistant-http = ["dep:reqwest"]
keyring-storage = ["dep:keyring"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
