<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DiskPilot">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#5856D6"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7D7AFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3634A3" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <!-- pilot ring -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
  <!-- gauge ticks -->
  <path d="M32 11.5v4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M16.8 20.4l3 2.4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M47.2 20.4l-3 2.4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- needle -->
  <path d="M32 32 L41.5 24.5" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3.6" fill="#FFFFFF"/>
</svg>
