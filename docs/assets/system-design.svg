<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="968" viewBox="0 0 1280 968" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E6E73"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5856D6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="968" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="20" y="40" font-size="21" font-weight="600" fill="#1D1D1F">DiskPilot — system design</text>
  <text x="20" y="64" font-size="13.5" fill="#6E6E73">Three layers, one direction: the UI asks, the shell bridges, the core decides.</text>

  <!-- ============ LAYER 1 : REACT UI ============ -->
  <rect x="20" y="84" width="944" height="124" rx="12" fill="#F5F5F7" stroke="#E5E5EA"/>
  <rect x="40" y="100" width="8" height="8" fill="#5856D6"/>
  <text x="56" y="108" font-size="13.5" font-weight="700" letter-spacing="1.8" fill="#1D1D1F">REACT UI — RENDERS AND ASKS · NO FILESYSTEM ACCESS</text>

  <rect x="40" y="118" width="520" height="72" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="54" y="142" font-size="15" font-weight="600" fill="#1D1D1F">Pages</text>
  <text x="54" y="162" font-size="13" fill="#6E6E73">Overview · Health · Storage · Cleanup ·</text>
  <text x="54" y="179" font-size="13" fill="#6E6E73">Applications · Games · History · Settings</text>

  <rect x="576" y="118" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="590" y="142" font-size="15" font-weight="600" fill="#1D1D1F">Quick Search</text>
  <text x="590" y="162" font-size="13" fill="#6E6E73">Ctrl+Shift+Space</text>
  <text x="590" y="179" font-size="13" fill="#6E6E73">search popup</text>

  <rect x="768" y="118" width="176" height="72" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="782" y="142" font-size="15" font-weight="600" fill="#1D1D1F">System tray</text>
  <text x="782" y="162" font-size="13" fill="#6E6E73">Free-space ring icon</text>
  <text x="782" y="179" font-size="13" fill="#6E6E73">Digest + menu</text>

  <!-- connector L1 -> L2 -->
  <line x1="492" y1="208" x2="492" y2="228" stroke="#5856D6" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="506" y="223" font-size="13" fill="#6E6E73">typed invoke calls · events</text>

  <!-- ============ LAYER 2 : TAURI SHELL ============ -->
  <rect x="20" y="232" width="944" height="124" rx="12" fill="#F5F5F7" stroke="#E5E5EA"/>
  <rect x="40" y="248" width="8" height="8" fill="#5856D6"/>
  <text x="56" y="256" font-size="13.5" font-weight="700" letter-spacing="1.8" fill="#1D1D1F">TAURI SHELL — BRIDGES</text>

  <rect x="40" y="268" width="214" height="72" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="54" y="292" font-size="15" font-weight="600" fill="#1D1D1F">Typed commands</text>
  <text x="54" y="312" font-size="13" fill="#6E6E73">One handler per UI action</text>
  <text x="54" y="329" font-size="13" fill="#6E6E73">Slow work off the UI thread</text>

  <rect x="268" y="268" width="214" height="72" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="282" y="292" font-size="15" font-weight="600" fill="#1D1D1F">Events</text>
  <text x="282" y="312" font-size="13" fill="#6E6E73">Scan progress + results</text>
  <text x="282" y="329" font-size="13" fill="#6E6E73">Tray navigation</text>

  <rect x="496" y="268" width="214" height="72" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="510" y="292" font-size="15" font-weight="600" fill="#1D1D1F">Single-instance</text>
  <text x="510" y="312" font-size="13" fill="#6E6E73">Second launch forwards</text>
  <text x="510" y="329" font-size="13" fill="#6E6E73">its --scan path, once</text>

  <rect x="724" y="268" width="214" height="72" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="738" y="292" font-size="15" font-weight="600" fill="#1D1D1F">Updater</text>
  <text x="738" y="312" font-size="13" fill="#6E6E73">Signed update packages</text>
  <text x="738" y="329" font-size="13" fill="#6E6E73">Verified before install</text>

  <!-- connector L2 -> L3 -->
  <line x1="492" y1="356" x2="492" y2="376" stroke="#5856D6" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="506" y="371" font-size="13" fill="#6E6E73">calls into the core</text>

  <!-- ============ LAYER 3 : RUST CORE ============ -->
  <rect x="20" y="380" width="944" height="336" rx="12" fill="#F5F5F7" stroke="#E5E5EA"/>
  <rect x="40" y="396" width="8" height="8" fill="#5856D6"/>
  <text x="56" y="404" font-size="13.5" font-weight="700" letter-spacing="1.8" fill="#1D1D1F">RUST CORE (DISKPILOT-CORE) — DECIDES · THE ONLY CODE THAT CAN REMOVE FILES</text>

  <text x="40" y="430" font-size="13" font-weight="700" letter-spacing="1.2" fill="#248A3D">THE SAFETY PIPELINE — THE ONLY PATH TO DELETION</text>

  <rect x="40" y="442" width="168" height="84" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="50" y="466" font-size="15" font-weight="600" fill="#1D1D1F">Scan engines</text>
  <text x="50" y="486" font-size="13" fill="#6E6E73">Parallel walker</text>
  <text x="50" y="503" font-size="13" fill="#6E6E73">MFT reader</text>
  <text x="50" y="520" font-size="13" fill="#6E6E73">USN live index</text>

  <line x1="210" y1="484" x2="222" y2="484" stroke="#6E6E73" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="224" y="442" width="168" height="84" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="234" y="466" font-size="15" font-weight="600" fill="#1D1D1F">Classifier</text>
  <text x="234" y="486" font-size="13" fill="#6E6E73">Eleven categories</text>
  <text x="234" y="503" font-size="13" fill="#6E6E73">Rule ID + reason</text>
  <text x="234" y="520" font-size="13" fill="#6E6E73">for every path</text>

  <line x1="394" y1="484" x2="406" y2="484" stroke="#6E6E73" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="408" y="442" width="168" height="84" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="418" y="466" font-size="15" font-weight="600" fill="#1D1D1F">Recommendations</text>
  <text x="418" y="486" font-size="13" fill="#6E6E73">Risk tiers</text>
  <text x="418" y="503" font-size="13" fill="#6E6E73">Why safe · risks</text>
  <text x="418" y="520" font-size="13" fill="#6E6E73">Tool's own commands</text>

  <line x1="578" y1="484" x2="590" y2="484" stroke="#6E6E73" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="592" y="442" width="168" height="84" rx="10" fill="#FFFFFF" stroke="#5856D6" stroke-width="1.5"/>
  <text x="602" y="466" font-size="15" font-weight="600" fill="#1D1D1F">Planner + gate</text>
  <text x="602" y="486" font-size="13" fill="#6E6E73">Plans carry IDs only</text>
  <text x="602" y="503" font-size="13" fill="#6E6E73">Gate validates</text>
  <text x="602" y="520" font-size="13" fill="#6E6E73">every path, twice</text>

  <line x1="762" y1="484" x2="774" y2="484" stroke="#6E6E73" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="776" y="442" width="168" height="84" rx="10" fill="#FFFFFF" stroke="#248A3D" stroke-width="1.5"/>
  <text x="786" y="466" font-size="15" font-weight="600" fill="#1D1D1F">Executor</text>
  <text x="786" y="486" font-size="13" fill="#6E6E73">Recycle Bin first</text>
  <text x="786" y="503" font-size="13" fill="#6E6E73">Permanent only if</text>
  <text x="786" y="520" font-size="13" fill="#6E6E73">every item qualifies</text>

  <text x="40" y="550" font-size="13" font-weight="700" letter-spacing="1.2" fill="#6E6E73">ANALYSIS + PLATFORM ENGINES</text>

  <rect x="40" y="562" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="54" y="585" font-size="15" font-weight="600" fill="#1D1D1F">Duplicates (SHA-256)</text>
  <text x="54" y="604" font-size="13" fill="#6E6E73">Size groups, then hash</text>
  <text x="54" y="620" font-size="13" fill="#6E6E73">Re-verified before moving</text>

  <rect x="268" y="562" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="282" y="585" font-size="15" font-weight="600" fill="#1D1D1F">App-junk rules</text>
  <text x="282" y="604" font-size="13" fill="#6E6E73">Curated cache locations</text>
  <text x="282" y="620" font-size="13" fill="#6E6E73">Discord · Chrome · VS Code</text>

  <rect x="496" y="562" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="510" y="585" font-size="15" font-weight="600" fill="#1D1D1F">SMART parsers</text>
  <text x="510" y="604" font-size="13" fill="#6E6E73">ATA attributes</text>
  <text x="510" y="620" font-size="13" fill="#6E6E73">NVMe health log</text>

  <rect x="724" y="562" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="738" y="585" font-size="15" font-weight="600" fill="#1D1D1F">Winget parser</text>
  <text x="738" y="604" font-size="13" fill="#6E6E73">Upgrade table parsing</text>
  <text x="738" y="620" font-size="13" fill="#6E6E73">IDs validated twice</text>

  <rect x="40" y="638" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="54" y="661" font-size="15" font-weight="600" fill="#1D1D1F">Relocation</text>
  <text x="54" y="680" font-size="13" fill="#6E6E73">Destination validation</text>
  <text x="54" y="696" font-size="13" fill="#6E6E73">Rollback byte-verified</text>

  <rect x="268" y="638" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="282" y="661" font-size="15" font-weight="600" fill="#1D1D1F">Maintenance policy</text>
  <text x="282" y="680" font-size="13" fill="#6E6E73">When a run is due</text>
  <text x="282" y="696" font-size="13" fill="#6E6E73">Which aged items qualify</text>

  <rect x="496" y="638" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="510" y="661" font-size="15" font-weight="600" fill="#1D1D1F">Search + OCR cache</text>
  <text x="510" y="680" font-size="13" fill="#6E6E73">Closed-grammar queries</text>
  <text x="510" y="696" font-size="13" fill="#6E6E73">Text read inside images</text>

  <rect x="724" y="638" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="738" y="661" font-size="15" font-weight="600" fill="#1D1D1F">Analysis</text>
  <text x="738" y="680" font-size="13" fill="#6E6E73">Docker · dev tools · apps</text>
  <text x="738" y="696" font-size="13" fill="#6E6E73">Games · media · forecast</text>

  <!-- connector L3 -> L4 -->
  <line x1="492" y1="716" x2="492" y2="736" stroke="#5856D6" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="506" y="731" font-size="13" fill="#6E6E73">executes through platform APIs</text>

  <!-- ============ LAYER 4 : WINDOWS PLATFORM ============ -->
  <rect x="20" y="740" width="944" height="184" rx="12" fill="#F5F5F7" stroke="#E5E5EA"/>
  <rect x="40" y="756" width="8" height="8" fill="#5856D6"/>
  <text x="56" y="764" font-size="13.5" font-weight="700" letter-spacing="1.8" fill="#1D1D1F">WINDOWS PLATFORM</text>

  <rect x="40" y="776" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="54" y="799" font-size="15" font-weight="600" fill="#1D1D1F">NTFS</text>
  <text x="54" y="818" font-size="13" fill="#6E6E73">Master File Table</text>
  <text x="54" y="834" font-size="13" fill="#6E6E73">USN change journal</text>

  <rect x="268" y="776" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="282" y="799" font-size="15" font-weight="600" fill="#1D1D1F">Recycle Bin</text>
  <text x="282" y="818" font-size="13" fill="#6E6E73">$I / $R item metadata</text>
  <text x="282" y="834" font-size="13" fill="#6E6E73">Restore · per-item empty</text>

  <rect x="496" y="776" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="510" y="799" font-size="15" font-weight="600" fill="#1D1D1F">SMART IOCTL</text>
  <text x="510" y="818" font-size="13" fill="#6E6E73">ATA pass-through</text>
  <text x="510" y="834" font-size="13" fill="#6E6E73">NVMe protocol command</text>

  <rect x="724" y="776" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="738" y="799" font-size="15" font-weight="600" fill="#1D1D1F">winget</text>
  <text x="738" y="818" font-size="13" fill="#6E6E73">Upgrade checks</text>
  <text x="738" y="834" font-size="13" fill="#6E6E73">Per-app updates</text>

  <rect x="40" y="852" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="54" y="875" font-size="15" font-weight="600" fill="#1D1D1F">robocopy + junctions</text>
  <text x="54" y="894" font-size="13" fill="#6E6E73">Verified folder copies</text>
  <text x="54" y="910" font-size="13" fill="#6E6E73">Links keep old paths</text>

  <rect x="268" y="852" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="282" y="875" font-size="15" font-weight="600" fill="#1D1D1F">Registry</text>
  <text x="282" y="894" font-size="13" fill="#6E6E73">Startup Run entries</text>
  <text x="282" y="910" font-size="13" fill="#6E6E73">Explorer context menu</text>

  <rect x="496" y="852" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="510" y="875" font-size="15" font-weight="600" fill="#1D1D1F">Credential Manager</text>
  <text x="510" y="894" font-size="13" fill="#6E6E73">Assistant API keys</text>
  <text x="510" y="910" font-size="13" fill="#6E6E73">Stored, never read back</text>

  <rect x="724" y="852" width="214" height="64" rx="10" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="738" y="875" font-size="15" font-weight="600" fill="#1D1D1F">Windows OCR</text>
  <text x="738" y="894" font-size="13" fill="#6E6E73">WinRT recognizer</text>
  <text x="738" y="910" font-size="13" fill="#6E6E73">Fully on-device</text>

  <!-- ============ SIDE RAIL : LOCAL STORES ============ -->
  <rect x="988" y="232" width="272" height="692" rx="12" fill="#FFFFFF" stroke="#D1D1D6"/>
  <rect x="1004" y="248" width="8" height="8" fill="#5856D6"/>
  <text x="1020" y="256" font-size="13.5" font-weight="700" letter-spacing="1.8" fill="#1D1D1F">LOCAL STORES</text>

  <rect x="1004" y="276" width="240" height="64" rx="10" fill="#F5F5F7" stroke="#D1D1D6"/>
  <text x="1018" y="299" font-size="15" font-weight="600" fill="#1D1D1F">SQLite History</text>
  <text x="1018" y="318" font-size="13" fill="#6E6E73">Every action + every scan</text>
  <text x="1018" y="334" font-size="13" fill="#6E6E73">Cleanup undo lives here</text>

  <rect x="1004" y="354" width="240" height="64" rx="10" fill="#F5F5F7" stroke="#D1D1D6"/>
  <text x="1018" y="377" font-size="15" font-weight="600" fill="#1D1D1F">settings.json</text>
  <text x="1018" y="396" font-size="13" fill="#6E6E73">Preferences · Watch schedule</text>
  <text x="1018" y="412" font-size="13" fill="#6E6E73">Automatic maintenance</text>

  <rect x="1004" y="432" width="240" height="64" rx="10" fill="#F5F5F7" stroke="#D1D1D6"/>
  <text x="1018" y="455" font-size="15" font-weight="600" fill="#1D1D1F">Scan index + snapshot</text>
  <text x="1018" y="474" font-size="13" fill="#6E6E73">In-memory index of the scan</text>
  <text x="1018" y="490" font-size="13" fill="#6E6E73">Last scan kept for launch</text>

  <rect x="1004" y="510" width="240" height="64" rx="10" fill="#F5F5F7" stroke="#D1D1D6"/>
  <text x="1018" y="533" font-size="15" font-weight="600" fill="#1D1D1F">scan_history.json</text>
  <text x="1018" y="552" font-size="13" fill="#6E6E73">Per-scan time series</text>
  <text x="1018" y="568" font-size="13" fill="#6E6E73">Forecast + growth alerts</text>

  <rect x="1004" y="588" width="240" height="64" rx="10" fill="#F5F5F7" stroke="#D1D1D6"/>
  <text x="1018" y="611" font-size="15" font-weight="600" fill="#1D1D1F">USN checkpoints</text>
  <text x="1018" y="630" font-size="13" fill="#6E6E73">Journal position per volume</text>
  <text x="1018" y="646" font-size="13" fill="#6E6E73">Live-index resume point</text>

  <rect x="1004" y="666" width="240" height="64" rx="10" fill="#F5F5F7" stroke="#D1D1D6"/>
  <text x="1018" y="689" font-size="15" font-weight="600" fill="#1D1D1F">OCR cache</text>
  <text x="1018" y="708" font-size="13" fill="#6E6E73">Text read from images</text>
  <text x="1018" y="724" font-size="13" fill="#6E6E73">Keyed to each file version</text>

  <rect x="1004" y="748" width="240" height="168" rx="10" fill="#F5F5F7" stroke="#248A3D"/>
  <text x="1018" y="772" font-size="15" font-weight="600" fill="#1D1D1F">Privacy</text>
  <text x="1018" y="792" font-size="13" fill="#6E6E73">No account. No telemetry.</text>
  <text x="1018" y="810" font-size="13" fill="#6E6E73">No analytics, no crash reports.</text>
  <text x="1018" y="828" font-size="13" fill="#6E6E73">Everything is computed and</text>
  <text x="1018" y="846" font-size="13" fill="#6E6E73">stored on this PC. The only</text>
  <text x="1018" y="864" font-size="13" fill="#6E6E73">network feature is the optional</text>
  <text x="1018" y="882" font-size="13" fill="#6E6E73">assistant, talking directly to</text>
  <text x="1018" y="900" font-size="13" fill="#6E6E73">your chosen provider.</text>

  <!-- dashed persistence connectors -->
  <line x1="964" y1="308" x2="986" y2="308" stroke="#6E6E73" stroke-width="1.25" stroke-dasharray="4 3"/>
  <line x1="964" y1="464" x2="986" y2="464" stroke="#6E6E73" stroke-width="1.25" stroke-dasharray="4 3"/>
  <line x1="964" y1="620" x2="986" y2="620" stroke="#6E6E73" stroke-width="1.25" stroke-dasharray="4 3"/>

  <!-- Footer -->
  <text x="20" y="950" font-size="13" fill="#6E6E73">Every size shown is allocated bytes · permanent deletion is opt-in per plan and gated in the core · folder moves are copy → verify → link, with rollback</text>
</svg>
