name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows — frontend, Rust, installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # tsc + vite. The dist output is also what the Tauri build
      # embeds, so this runs before every Rust step.
      - name: Build frontend
        run: npm run build

      - name: Lint (frontend)
        run: npm run lint

      - name: Test (frontend)
        run: npm run test

      - name: Format check (Rust)
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # On windows-latest the shell's test binary links against the
      # platform WebView2/CRT stack natively and actually RUNS here —
      # this is the gate that proves the full shell test suite, not
      # just the core's.
      - name: Test (Rust workspace)
        run: cargo test --workspace

      # Proves the MSI + NSIS installers and the signed updater
      # artifacts compile end to end. Nothing is published from CI.
      - name: Build installers (MSI + NSIS, no publish)
        run: npm run app:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  core-linux:
    name: Core crate tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Core crate tests
        run: cargo test -p diskpilot-core
