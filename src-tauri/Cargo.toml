[package]
name = "diskpilot"
version = "0.6.0"
description = "DiskPilot — storage intelligence for Windows"
authors = ["DiskPilot contributors"]
edition = "2021"
rust-version = "1.82"
license = "MIT"
homepage = "https://github.com/anilkumara9/diskpilot"

[lib]
name = "diskpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diskpilot-core = { path = "../crates/core", features = ["assistant-http", "keyring-storage"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Autostart registration lives in the per-user Run key (Windows only).
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# The release profile lives in the workspace-root Cargo.toml (profiles on
# non-root packages are ignored by Cargo).
