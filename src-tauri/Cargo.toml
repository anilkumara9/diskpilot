[package]
name = "diskpilot"
version = "0.5.1"
description = "DiskPilot — storage intelligence for Windows"
authors = ["DiskPilot contributors"]
edition = "2021"
rust-version = "1.82"
license = "MIT"
homepage = "https://tauri.app"

[lib]
name = "diskpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diskpilot-core = { path = "../crates/core", features = ["assistant-http", "keyring-storage"] }

# The release profile lives in the workspace-root Cargo.toml (profiles on
# non-root packages are ignored by Cargo).
